notes: |
  HOW THE MODULES WERE BUILT
  Every gene here was taken from the text of the named reviews, not from background
  knowledge. Full-text JATS XML for each review was retrieved from Europe PMC. Reference
  lists and back matter were stripped. Candidate gene mentions were then found by
  dictionary matching against the HGNC complete set (approved symbols plus approved
  alias_symbol and prev_symbol entries, protein-coding genes only), so every symbol in a
  module corresponds to a token the review itself wrote. Greek letters and hyphenation were
  normalised (PGC-1alpha -> PPARGC1A, Top2beta -> TOP2B, eNOS -> NOS3 and so on). Every gene
  that survived the two-source rule was then read back in its source sentences and kept only
  if the sentence is a mechanism statement; the rejections are listed below. Counts of
  "sources" are numbers of distinct seed reviews, never numbers of mentions.

  THERAPY EXCLUSION
  Nothing about treating or preventing these toxicities was allowed to influence membership.
  Sections whose headings concern therapy, prevention, cardioprotection, management,
  diagnosis, biomarkers, imaging, surveillance, risk scores, epidemiology or future
  directions were removed before scanning, and individual sentences that survived that filter
  but are about a protective agent were rejected by hand (logged below). No cardioprotective
  drug was looked up at any point.

  MODULE SIZES
  M1 34 genes from 7 reviews. M2 15 genes from 13 reviews. M4 15 genes from 7 reviews.
  M3 reached only 14 genes from 8 reviews and is therefore BELOW the minimum of 15. This is
  reported rather than padded. 20 genes met the two-source rule inside M3, but the no-overlap
  rule then moved AKT1, MAPK1 and EGFR to M2 and NFKB1 to M4 (all on source-count majority),
  and dropped NOS3 and SRC from every module as ties. The majority rule is sensitive to how
  many seed reviews a module has, and M2 has 13 reviews against M3's 8, so shared signalling
  nodes systematically migrate towards M2. NOS3 is the most consequential loss: it is named
  by 4 M2 reviews and 4 M3 reviews, an exact tie, so construction rule 4 removed it from
  both even though endothelial nitric oxide is listed as core M3 biology.

  M2 and M3 each needed more seed reviews than were first collected. M2 stood at 13 genes
  with 6 reviews and at 13 again with 8; four further anti-HER2 / NRG1-ErbB cardiac reviews
  (S9-S13, found by topic search, not by gene yield) brought it to 15. For M3, S7 and S8 were
  added for the same reason. Every added source is a genuine mechanism review for that
  module; none was chosen by inspecting which genes it would contribute.

  SOURCES COVERING MORE THAN ONE MECHANISM
  PMC12584439 covers both anthracycline and HER2 biology and is used twice, restricted by
  section heading: its topoisomerase/oxidative/mitochondrial/iron/calcium/epigenetic sections
  feed M1 (as S7) and its HER2 and neuregulin sections feed M2 (as S6). PMC13073610 and
  PMC13590445 feed M2 only through their "HER2/ErbB2 Signaling Disruption" and
  "HER2 Inhibitors" sections. PMC11602306 (M4 S1) had its drug-specific subsections for
  doxorubicin, TKIs, bevacizumab, cisplatin, 5-FU and celastrol removed; PMC13424589 (M4 S3)
  had its CAR-T and bispecific-antibody sections removed; PMC13746687 (M3 S3) had its
  anthracycline sections removed. Those restrictions are why some genes present in a document
  do not appear in the module it feeds.

  JUDGEMENT CALLS ON SYMBOLS
  - eIF2-alpha is written "eIF2A" by M4 S1 and "eIF2alpha" by M4 S5 and S6. The HGNC symbol
    for that subunit is EIF2S1; HGNC EIF2A is a different gene. Recorded as EIF2S1.
  - "LC3" was resolved to MAP1LC3B, the cardiac isoform the reviews are describing; LC3A was
    not separately named.
  - AKT -> AKT1, ERK/ERK2 -> MAPK1, ERK1 -> MAPK3, p38 -> MAPK14, JNK -> MAPK8,
    Drp1 -> DNM1L, SERCA/SERCA2a -> ATP2A2, NCX -> SLC8A1, PGC-1alpha -> PPARGC1A,
    Parkin -> PRKN, Nix -> BNIP3L, FPN -> SLC40A1, TfR1 -> TFRC, HSPB5/CryAB -> CRYAB.
  - Complexes and families named without a subunit were NOT converted to a symbol and are
    absent: AMPK, PI3K, PKC, PKA, NADPH oxidase, soluble guanylate cyclase, the proteasome
    itself, "ErbB" used for the receptor family, "IL-1" used for the family.
  - Alias collisions were resolved by hand where HGNC maps one string to two genes:
    NRF2 -> NFE2L2 (not GABPA), iNOS -> NOS2 (not ISYNA1), YAP -> YAP1 (not YY1AP1),
    DRP1 -> DNM1L (not UTRN), p38 -> MAPK14 (not AHSA1), HIF-1 -> HIF1A (not SETD2).

  NO PROTEASOME SUBUNIT GENES ARE IN M4
  The reviews seeding M4 describe proteasome inhibition in words ("the 20S proteasome",
  "chymotrypsin-like activity") and essentially never name a subunit gene. Across the seven
  M4 reviews the only subunit symbol written anywhere is PSMB10, once, in a single review;
  PSMB5 is never written, nor is any "beta5" spelled out. So no PSM* gene reaches two sources
  and none is included. Adding PSMB5 would have been exactly the kind of plausible-looking
  invention the brief forbids.

  GENES REJECTED AFTER READING THE SENTENCE (whole gene)
  M2 GDF15: both sources name GDF-15 only as a circulating biomarker.
  M3 ACE: abbreviation list plus ACE-inhibitor therapy sentences.
  M3 AXL, KIT, MET, RET: named only inside lists of the additional kinases a multi-target TKI
    blocks; off-target kinase pharmacology, not VEGF-pathway biology.
  M3 KCNH2: named only as an off-target channel for QTc prolongation, with the source stating
    explicitly that the effect is not VEGFR-mediated.
  M3 CTSG: false positive, the tokens were "C-gamma"/"Cgamma" meaning phospholipase C-gamma.
  M3 ADAM17: false positive, both tokens were "TACE" (transarterial chemoembolisation).
  M3 ICAM1, VCAM1: one source names them for VEGF-pathway inhibition, the other for immune
    checkpoint inhibitors.
  M3 CRP: biomarker contexts only.
  M3 CD4, CD8A, IL1B, IL6, MMP9, STAT3, TGFB1, TNF: supported only by the immune and fibrosis
    tables that describe anthracycline-induced cardiotoxicity inside PMC13746687, or by
    non-cardiac disease sections (endometriosis, rheumatoid arthritis, diabetic retinopathy)
    of PMC12086256.
  M3 SP1: only one source names Sp1 in a VEGF-promoter context.
  M3 EIF2A/EIF2AK3: single metabolomics source; ER-stress biology sits in M4.

  SUPPORTS REJECTED (gene kept, that one source not counted)
  M1 FAS in S4: the token was "FAs", fatty acids.
  M2 NOS3 and PPARGC1A in S2: the only occurrence is a metformin cardioprotection sentence.
  M2 IL6 in S9: a table of candidate protective agents. M2 TNNT2 in S9 and S13: troponin-assay
    biomarker context. Both genes then fell below two sources and are absent.
  M4 PTEN in S4: the token came from the full name "PTEN-induced putative kinase 1" (PINK1);
    PTEN then fell below two sources.
  M4 TNF, IL1B, IL6 in S1: rows of a drug-summary table. M4 TNF, IL1B in S3: CAR-T and
    bispecific cytokine sections. All three genes then fell below two sources.
  M4 MTOR in S7: a sentence about mTOR inhibition as a therapy.
  M4 UBD in S7: "UBD" there means ubiquitin-binding domain, not the UBD gene; UBD then fell
    below two sources.
  M4 HIF1A in S6: listed only as a generic mTOR-independent autophagy regulator.

  TIES DROPPED FROM BOTH MODULES (construction rule 4)
  NOS3 (4 M2 vs 4 M3), PINK1 (3 M1 vs 3 M4), MFN2 (2 M1 vs 2 M4), NFE2L2 (2 M1 vs 2 M4),
  SRC (2 M2 vs 2 M3). Each is real biology for both modules; the rule removes them rather
  than assigning them arbitrarily.

  ACCESS AND COVERAGE LIMITS
  Only open-access full text indexed in Europe PMC was used, so subscription-only mechanism
  reviews could not be read and are not cited. Detection depends on a review writing a symbol
  or a recognised alias: a review that only writes "endothelial nitric oxide synthase" with no
  abbreviation, or only "the transferrin receptor", contributes nothing for that gene. This
  under-counts older and more narrative reviews. Some supports come from figure legends and
  abbreviation lists, which are the review's own text and were accepted; where an abbreviation
  list was the gene's only appearance in a biomarker or clinical context it was rejected, as
  logged above. Non-coding genes were excluded from the dictionary, so the microRNAs these
  reviews discuss at length (miR-23a, miR-320a and others) are not represented.
